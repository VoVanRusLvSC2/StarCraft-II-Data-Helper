name: Build Windows installer

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag that receives the installer
        required: true
        default: v3.0.0-beta.1

jobs:
  installer:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Ninja Multi-Config"
      - name: Build
        run: cmake --build build --config Release --target SC2DataHelper SC2OptimizeMaps SC2RepairMapEnums SC2DecorOptimizeMap SC2DataHelperTests
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage release files
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $stage = "dist/SC2DataHelper-$version-win64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/Release/SC2DataHelper.exe $stage/
          Copy-Item build/Release/SC2OptimizeMaps.exe $stage/
          Copy-Item build/Release/SC2RepairMapEnums.exe $stage/
          Copy-Item build/Release/SC2DecorOptimizeMap.exe $stage/
          Copy-Item resources $stage/resources -Recurse
          Copy-Item scripts $stage/scripts -Recurse
          Copy-Item LICENSE $stage/
          Copy-Item README.md $stage/
          Copy-Item docs/USER_GUIDE.md $stage/
      - name: Deploy Qt
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $stage = "dist/SC2DataHelper-$version-win64"
          Get-ChildItem $stage -Filter '*.exe' -File | ForEach-Object {
            windeployqt --release --no-translations $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "windeployqt failed for $($_.Name)"
            }
          }
      - name: Bundle Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $stage = "dist/SC2DataHelper-$version-win64"
          if ([string]::IsNullOrWhiteSpace($env:VCToolsRedistDir)) {
            throw 'VCToolsRedistDir is not available; cannot create an app-local VC++ runtime package.'
          }
          $runtimeDir = Get-ChildItem -LiteralPath $env:VCToolsRedistDir -Directory -Recurse |
            Where-Object { $_.Name -like 'Microsoft.VC*.CRT' -and $_.Parent.Name -eq 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $runtimeDir) {
            throw 'The x64 Microsoft Visual C++ runtime DLL directory was not found.'
          }
          $runtimeDlls = Get-ChildItem -LiteralPath $runtimeDir.FullName -Filter '*.dll' -File
          if ($runtimeDlls.Count -eq 0) {
            throw "No runtime DLLs were found in $($runtimeDir.FullName)."
          }
          Copy-Item $runtimeDlls.FullName -Destination $stage -Force

          $runtimePath = Join-Path $stage 'vc_redist.x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $runtimePath
          $signature = Get-AuthenticodeSignature $runtimePath
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') {
            throw 'The bundled Visual C++ runtime is not a valid Microsoft-signed installer.'
          }
      - name: Verify staged package
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $stage = "dist/SC2DataHelper-$version-win64"
          $required = @(
            'SC2DataHelper.exe',
            'SC2OptimizeMaps.exe',
            'SC2RepairMapEnums.exe',
            'SC2DecorOptimizeMap.exe',
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'platforms/qwindows.dll',
            'MSVCP140.dll',
            'MSVCP140_2.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll',
            'vc_redist.x64.exe'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $stage $_)) }
          if ($missing) {
            throw "Release package is incomplete: $($missing -join ', ')"
          }
          & (Join-Path $stage 'SC2DecorOptimizeMap.exe') '--help'
          if ($LASTEXITCODE -ne 0) {
            throw 'The packaged SC2DecorOptimizeMap.exe did not start successfully.'
          }
          $gui = Start-Process -FilePath (Join-Path $stage 'SC2DataHelper.exe') -WorkingDirectory $stage -PassThru
          try {
            Start-Sleep -Seconds 5
            $gui.Refresh()
            if ($gui.HasExited) {
              throw "The packaged GUI exited during the startup smoke check (exit code $($gui.ExitCode))."
            }
          } finally {
            if (-not $gui.HasExited) {
              Stop-Process -Id $gui.Id -Force
            }
          }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          iscc "/DAppVersion=$version" packaging/SC2DataHelper.iss
      - name: Upload installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:RELEASE_TAG dist/SC2DataHelper-*-setup.exe --clobber
