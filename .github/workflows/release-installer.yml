name: Build Windows installer

on:
  release:
    types: [published]

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target SC2DataHelper SC2OptimizeMaps SC2RepairMapEnums
      - name: Stage release files
        shell: pwsh
        run: |
          $version = '${{ github.event.release.tag_name }}'.TrimStart('v')
          $stage = "dist/SC2DataHelper-$version-win64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/Release/SC2DataHelper.exe $stage/
          Copy-Item build/Release/SC2OptimizeMaps.exe $stage/
          Copy-Item build/Release/SC2RepairMapEnums.exe $stage/
          Copy-Item resources $stage/resources -Recurse
          Copy-Item scripts $stage/scripts -Recurse
          Copy-Item LICENSE $stage/
          Copy-Item README.md $stage/
          Copy-Item docs/USER_GUIDE.md $stage/
      - name: Deploy Qt
        shell: pwsh
        run: |
          $version = '${{ github.event.release.tag_name }}'.TrimStart('v')
          windeployqt --release --no-translations --compiler-runtime "dist/SC2DataHelper-$version-win64/SC2DataHelper.exe"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ github.event.release.tag_name }}'.TrimStart('v')
          iscc "/DAppVersion=$version" packaging/SC2DataHelper.iss
      - name: Upload installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} dist/SC2DataHelper-*-setup.exe --clobber
